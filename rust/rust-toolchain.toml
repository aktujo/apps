# SPDX-License-Identifier: MIT
# The Rust version the apps build with, as aktujo's (aktujo/aktujo, rust-toolchain.toml); the targets of the platforms
# falkOSS builds for, so that cargokit finds them installed.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
targets = ["aarch64-apple-darwin", "aarch64-apple-ios", "aarch64-apple-ios-sim", "aarch64-linux-android"]
profile = "minimal"
